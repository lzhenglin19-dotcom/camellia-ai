<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Camellia · 白山茶</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --white: #ffffff;
      --soft-white: #f0eeea;
      --glow: rgba(255, 255, 255, 0.85);
      --glow-dim: rgba(255, 255, 255, 0.25);
      --accent: #d4e8e1;
      --deep: #0a0f0d;
      --mid: #111a16;
      --panel: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.10);
      --text: #c8d8cf;
      --text-dim: #5a7068;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: 100dvh;
      background: var(--deep);
      color: var(--text);
      font-family: 'Noto Serif SC', serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* === BACKGROUND === */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, #0f2a1e 0%, #0a0f0d 70%);
    }
    .bg::after {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* === LAYOUT === */
    .app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      align-items: center;
      overscroll-behavior: none;
    }

    /* === HEADER === */
    header {
      width: 100%; display: flex;
      justify-content: space-between; align-items: center;
      padding: 28px 48px 0;
      padding-top: calc(28px + env(safe-area-inset-top, 0px));
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; font-weight: 300;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
    }
    .logo span { color: rgba(255,255,255,0.18); }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px #4ade80; }
      50% { opacity: 0.5; box-shadow: 0 0 3px #4ade80; }
    }

    /* === AVATAR SECTION === */
    .avatar-section {
      flex: 0 0 auto;
      display: flex; flex-direction: column;
      align-items: center;
      padding-top: 30px;
    }

    .avatar-wrapper {
      position: relative;
      width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Outer glow rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
      animation: ring-expand 4s ease-in-out infinite;
    }
    .ring-1 { width: 220px; height: 220px; animation-delay: 0s; }
    .ring-2 { width: 270px; height: 270px; animation-delay: 0.8s; border-color: rgba(255,255,255,0.04); }
    .ring-3 { width: 320px; height: 320px; animation-delay: 1.6s; border-color: rgba(255,255,255,0.02); }

    @keyframes ring-expand {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.03); opacity: 1; }
    }

    /* SVG Camellia */
    .camellia-svg {
      width: 180px; height: 180px;
      position: relative; z-index: 2;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.5));
      transition: filter 0.3s ease;
    }

    .camellia-svg.breathing {
      animation: camellia-breathe 2.2s ease-in-out infinite;
    }
    @keyframes camellia-breathe {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)) drop-shadow(0 0 30px rgba(255,255,255,0.1));
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 28px rgba(255,255,255,0.9)) drop-shadow(0 0 60px rgba(180,255,220,0.4)) drop-shadow(0 0 100px rgba(255,255,255,0.2));
        transform: scale(1.04);
      }
    }

    /* Petals glow on speaking */
    .petal-path {
      stroke: white;
      stroke-width: 0.8;
      fill: none;
      stroke-linecap: round;
      opacity: 0.75;
      transition: opacity 0.3s, stroke-width 0.3s;
    }
    .camellia-svg.breathing .petal-path {
      animation: petal-glow 2.2s ease-in-out infinite;
    }
    @keyframes petal-glow {
      0%, 100% { opacity: 0.6; stroke-width: 0.7; }
      50% { opacity: 1; stroke-width: 1.1; }
    }
    .stamen-dot {
      fill: white;
      opacity: 0.9;
      transform-box: fill-box;
      transform-origin: center;
    }
    .camellia-svg.breathing .stamen-dot {
      animation: stamen-pulse 2.2s ease-in-out infinite;
    }
    @keyframes stamen-pulse {
      0%, 100% { opacity: 0.7; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    /* Name label */
    .avatar-name {
      margin-top: 22px; text-align: center;
    }
    .avatar-name h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem; font-weight: 300;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.88);
      text-shadow: 0 0 40px rgba(255,255,255,0.3);
    }
    .avatar-name p {
      font-size: 0.72rem; letter-spacing: 0.4em;
      color: var(--text-dim); margin-top: 4px;
      font-weight: 200;
    }

    /* === CHAT AREA === */
    .chat-area {
      flex: 1 1 auto;
      width: 100%; max-width: 680px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 24px 12px;
      display: flex; flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      display: flex; gap: 10px;
      animation: msg-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; }

    .msg-bubble {
      max-width: 75%;
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 0.88rem; line-height: 1.65;
      position: relative;
    }
    .msg.ai .msg-bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--soft-white);
      border-top-left-radius: 4px;
    }
    .msg.user .msg-bubble {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.8);
      border-top-right-radius: 4px;
    }
    .msg-avatar {
      width: 28px; height: 28px; flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      margin-top: 2px;
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .msg.ai .msg-avatar { background: rgba(255,255,255,0.04); }
    .msg.user .msg-avatar { background: rgba(255,255,255,0.06); }

    /* Typing indicator */
    .typing-indicator {
      display: flex; gap: 5px; align-items: center;
      padding: 14px 18px;
    }
    .typing-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.4);
      animation: typing-bounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* === INPUT BAR === */
    .input-bar {
      width: 100%; max-width: 680px;
      padding: 0 24px 32px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      flex-shrink: 0;
    }
    .input-container {
      display: flex; gap: 10px; align-items: flex-end;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 10px 10px 18px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .input-container:focus-within {
      border-color: rgba(255,255,255,0.22);
      box-shadow: 0 0 30px rgba(255,255,255,0.04);
    }
    textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--soft-white); font-family: 'Noto Serif SC', serif;
      font-size: 0.88rem; line-height: 1.6; resize: none;
      min-height: 24px; max-height: 120px;
    }
    textarea::placeholder { color: var(--text-dim); }

    .btn-group { display: flex; gap: 8px; align-items: center; }

    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: rgba(255,255,255,0.3); color: white; background: rgba(255,255,255,0.06); }
    .icon-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.5);
      color: white;
      box-shadow: 0 0 16px rgba(255,255,255,0.15);
      animation: mic-pulse 1.5s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(255,255,255,0.1); }
      50% { box-shadow: 0 0 24px rgba(255,255,255,0.35); }
    }
    .send-btn {
      background: rgba(255,255,255,0.9);
      border: none; color: var(--deep);
    }
    .send-btn:hover { background: white; }

    /* Hint text */
    .hint {
      text-align: center;
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-top: 10px;
    }

    /* Mic wave visualizer */
    .mic-wave {
      display: none; align-items: center; gap: 3px;
      height: 20px; margin-bottom: 2px;
    }
    .mic-wave.active { display: flex; }
    .wave-bar {
      width: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.6);
      animation: wave-anim 0.8s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
    .wave-bar:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { height: 20px; animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { height: 12px; animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { height: 7px; animation-delay: 0.4s; }
    @keyframes wave-anim {
      from { transform: scaleY(0.4); opacity: 0.4; }
      to { transform: scaleY(1); opacity: 1; }
    }

    /* === RESPONSIVE — Mobile First === */

    /* Tablet & below */
    @media (max-width: 768px) {
      header {
        padding: 20px 20px 0;
        padding-top: calc(20px + env(safe-area-inset-top, 0px));
      }
      .logo {
        font-size: 0.95rem;
        letter-spacing: 0.25em;
      }

      .avatar-section {
        padding-top: 16px;
      }
      .avatar-wrapper {
        width: 160px; height: 160px;
      }
      .ring-1 { width: 160px; height: 160px; }
      .ring-2 { width: 200px; height: 200px; }
      .ring-3 { width: 240px; height: 240px; }

      .camellia-svg {
        width: 130px; height: 130px;
      }
      .avatar-name h1 {
        font-size: 1.8rem;
        letter-spacing: 0.2em;
      }
      .avatar-name p {
        font-size: 0.62rem;
        letter-spacing: 0.3em;
      }

      .chat-area {
        max-width: 100%;
        padding: 14px 14px 8px;
        gap: 10px;
      }
      .msg-bubble {
        max-width: 85%;
        padding: 10px 14px;
        font-size: 0.82rem;
        line-height: 1.6;
      }
      .msg-avatar {
        width: 24px; height: 24px;
        font-size: 0.6rem;
      }

      .input-bar {
        max-width: 100%;
        padding: 0 14px 20px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      }
      .input-container {
        padding: 8px 8px 8px 14px;
        border-radius: 16px;
      }
      textarea {
        font-size: 16px; /* iOS 防缩放 */
        min-height: 22px;
        max-height: 100px;
      }
      .icon-btn {
        width: 34px; height: 34px;
      }
      .icon-btn svg {
        width: 14px; height: 14px;
      }
      .hint {
        font-size: 0.6rem;
        margin-top: 8px;
      }

      /* 让手机端用户能看到更多聊天内容 */
      .avatar-section {
        flex: 0 0 auto;
      }
      .app {
        height: 100dvh; /* 使用 dynamic viewport height */
      }
    }

    /* Small phones */
    @media (max-width: 400px) {
      header {
        padding: 14px 14px 0;
        padding-top: calc(14px + env(safe-area-inset-top, 0px));
      }
      .logo {
        font-size: 0.82rem;
        letter-spacing: 0.2em;
      }
      .status-dot {
        width: 5px; height: 5px;
      }

      .avatar-section {
        padding-top: 8px;
      }
      .avatar-wrapper {
        width: 120px; height: 120px;
      }
      .ring-1 { width: 120px; height: 120px; }
      .ring-2 { width: 155px; height: 155px; }
      .ring-3 { width: 190px; height: 190px; }
      .camellia-svg {
        width: 100px; height: 100px;
      }
      .avatar-name {
        margin-top: 14px;
      }
      .avatar-name h1 {
        font-size: 1.4rem;
      }
      .avatar-name p {
        font-size: 0.55rem;
      }

      .chat-area {
        padding: 10px 10px 6px;
        gap: 8px;
      }
      .msg-bubble {
        max-width: 88%;
        padding: 8px 12px;
        font-size: 0.78rem;
      }
      .msg-avatar {
        width: 20px; height: 20px;
        font-size: 0.55rem;
      }

      .input-bar {
        padding: 0 10px 14px;
        padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      }
      .input-container {
        padding: 6px 6px 6px 12px;
        border-radius: 14px;
        gap: 6px;
      }
      textarea {
        font-size: 16px; /* iOS 防缩放 */
        min-height: 20px;
        max-height: 80px;
      }
      .icon-btn {
        width: 30px; height: 30px;
      }
      .icon-btn svg {
        width: 12px; height: 12px;
      }
      .hint {
        font-size: 0.55rem;
        margin-top: 6px;
      }
    }

    /* Landscape phone: 压缩 avatar，最大化聊天区 */
    @media (max-height: 600px) and (orientation: landscape) {
      .avatar-section {
        padding-top: 6px;
        flex: 0 0 auto;
      }
      .avatar-wrapper {
        width: 90px; height: 90px;
      }
      .ring-1 { width: 90px; height: 90px; }
      .ring-2 { width: 120px; height: 120px; }
      .ring-3 { width: 150px; height: 150px; }
      .camellia-svg {
        width: 74px; height: 74px;
      }
      .avatar-name {
        margin-top: 6px;
      }
      .avatar-name h1 {
        font-size: 1.1rem;
      }
      .avatar-name p {
        display: none;
      }
      .chat-area {
        padding: 6px 10px 4px;
        gap: 6px;
      }
      .input-bar {
        padding: 0 10px 8px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      }
    }

    /* === TTS Button on AI messages === */
    .msg-tts-btn {
      background: none; border: none;
      color: var(--text-dim); cursor: pointer;
      padding: 4px 6px; border-radius: 6px;
      font-size: 0.7rem;
      display: inline-flex; align-items: center; gap: 4px;
      transition: all 0.25s ease;
      opacity: 0.4;
      margin-left: 4px;
      vertical-align: middle;
    }
    .msg-tts-btn:hover { opacity: 1; color: white; background: rgba(255,255,255,0.06); }
    .msg-tts-btn.speaking {
      color: #4ade80; opacity: 1;
      animation: tts-pulse 1s ease-in-out infinite;
    }
    @keyframes tts-pulse {
      0%, 100% { text-shadow: 0 0 4px rgba(74,222,128,0.3); }
      50% { text-shadow: 0 0 12px rgba(74,222,128,0.7); }
    }

    /* Voice selector panel */
    .voice-panel {
      position: fixed; z-index: 50;
      bottom: 90px; right: 20px;
      background: rgba(10,15,13,0.92);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      min-width: 220px;
      transform: translateY(12px);
      opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .voice-panel.open {
      transform: translateY(0);
      opacity: 1; pointer-events: all;
    }
    .voice-panel h4 {
      font-size: 0.7rem; letter-spacing: 0.15em;
      color: var(--text-dim); margin-bottom: 10px;
      font-weight: 300;
    }
    .voice-option {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
      font-size: 0.82rem; color: var(--text);
    }
    .voice-option:hover { background: rgba(255,255,255,0.06); }
    .voice-option.active { background: rgba(255,255,255,0.1); color: white; }
    .voice-option .radio {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid var(--text-dim);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .voice-option.active .radio { border-color: #4ade80; }
    .voice-option.active .radio::after {
      content: ''; width: 6px; height: 6px;
      border-radius: 50%; background: #4ade80;
    }
    .voice-option .vname { flex: 1; }
    .voice-option .vlang { font-size: 0.65rem; color: var(--text-dim); }

    /* Voice selector toggle button */
    #voiceToggleBtn {
      position: relative;
    }
    #voiceToggleBtn.has-voices {
      border-color: rgba(74,222,128,0.3);
      color: rgba(74,222,128,0.7);
    }

    /* Floating particles background */
    .particles-bg {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle-dot {
      position: absolute;
      width: 3px; height: 3px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      animation: particle-float linear infinite;
    }
    @keyframes particle-float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Floating petal particles */
    .petal-particle {
      position: fixed;
      z-index: 0; pointer-events: none;
      font-size: 1.2rem;
      opacity: 0.12;
      animation: petal-drift linear infinite;
    }
    @keyframes petal-drift {
      0% { transform: translateY(100vh) rotate(0deg) translateX(0); opacity: 0; }
      10% { opacity: 0.12; }
      90% { opacity: 0.08; }
      100% { transform: translateY(-5vh) rotate(360deg) translateX(80px); opacity: 0; }
    }

    /* Enhanced glow on the bg */
    .bg .glow-spot {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: glow-drift 8s ease-in-out infinite alternate;
    }
    .bg .glow-spot:nth-child(1) {
      width: 300px; height: 300px;
      background: rgba(255,255,255,0.04);
      top: 20%; left: 30%;
      animation-delay: 0s;
    }
    .bg .glow-spot:nth-child(2) {
      width: 200px; height: 200px;
      background: rgba(180,255,220,0.03);
      top: 60%; left: 60%;
      animation-delay: -3s;
    }
    .bg .glow-spot:nth-child(3) {
      width: 250px; height: 250px;
      background: rgba(255,220,240,0.02);
      top: 40%; left: 10%;
      animation-delay: -6s;
    }
    @keyframes glow-drift {
      0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      100% { transform: translate(30px, -20px) scale(1.2); opacity: 1; }
    }

    /* === FIXED: Mobile input bar overflow fix === */
    @media (max-width: 768px) {
      .btn-group {
        flex-shrink: 0;
      }
      .input-container {
        flex-wrap: nowrap;
        width: 100%;
      }
      .input-container > div:first-child {
        min-width: 0;
        flex: 1;
      }
      .icon-btn.send-btn {
        width: 34px; height: 34px;
        flex-shrink: 0;
      }
      .voice-panel {
        right: 10px; bottom: 80px;
        min-width: 190px;
      }
    }

    @media (max-width: 400px) {
      .btn-group {
        gap: 4px;
      }
      .voice-panel {
        right: 6px; left: 6px;
        bottom: 76px;
        min-width: unset;
      }
    }

    @media (max-width: 360px) {
      .input-container {
        padding: 5px 5px 5px 10px;
        gap: 4px;
      }
      .icon-btn {
        width: 28px; height: 28px;
      }
      .icon-btn svg {
        width: 11px; height: 11px;
      }
      .icon-btn.send-btn {
        width: 28px; height: 28px;
      }
      textarea {
        font-size: 16px;
      }
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(200, 60, 60, 0.85); backdrop-filter: blur(10px);
      color: white; padding: 10px 20px; border-radius: 10px;
      font-size: 0.8rem; z-index: 100;
      animation: toast-in 0.3s ease, toast-out 0.3s ease 2.7s forwards;
      pointer-events: none;
    }
    @keyframes toast-in { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
    @keyframes toast-out { to { opacity:0; } }
  </style>
</head>
<body>
<div class="bg">
  <div class="glow-spot"></div>
  <div class="glow-spot"></div>
  <div class="glow-spot"></div>
</div>
<div class="particles-bg" id="particlesBg"></div>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">Camellia <span>· AI</span></div>
    <div class="status-dot" title="在线"></div>
  </header>

  <!-- Avatar -->
  <div class="avatar-section">
    <div class="avatar-wrapper">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>

      <!-- SVG Camellia Flower made of white lines -->
      <svg class="camellia-svg" id="camelliaAvatar" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Petals (8 petals, each a curved path) -->
        <!-- Petal 1 - top -->
        <path class="petal-path" d="M100,100 C95,82 88,65 100,48 C112,65 105,82 100,100 Z"/>
        <!-- Petal 2 - top-right -->
        <path class="petal-path" d="M100,100 C114,90 128,78 140,85 C133,98 118,96 100,100 Z"/>
        <!-- Petal 3 - right -->
        <path class="petal-path" d="M100,100 C118,103 135,110 138,122 C125,128 114,118 100,100 Z"/>
        <!-- Petal 4 - bottom-right -->
        <path class="petal-path" d="M100,100 C107,116 110,132 102,143 C90,138 90,122 100,100 Z"/>
        <!-- Petal 5 - bottom -->
        <path class="petal-path" d="M100,100 C92,116 80,130 68,126 C68,113 82,106 100,100 Z"/>
        <!-- Petal 6 - bottom-left -->
        <path class="petal-path" d="M100,100 C85,104 70,104 64,94 C72,84 86,88 100,100 Z"/>
        <!-- Petal 7 - left -->
        <path class="petal-path" d="M100,100 C84,94 70,84 72,72 C84,68 94,80 100,100 Z"/>
        <!-- Petal 8 - top-left -->
        <path class="petal-path" d="M100,100 C88,86 86,70 95,60 C106,66 107,82 100,100 Z"/>

        <!-- Inner smaller petals -->
        <path class="petal-path" style="opacity:0.45" d="M100,100 C97,90 93,80 100,72 C107,80 103,90 100,100 Z"/>
        <path class="petal-path" style="opacity:0.45" d="M100,100 C108,96 116,90 120,97 C115,104 108,102 100,100 Z"/>
        <path class="petal-path" style="opacity:0.45" d="M100,100 C104,108 104,116 98,120 C92,116 94,108 100,100 Z"/>
        <path class="petal-path" style="opacity:0.45" d="M100,100 C92,106 84,108 80,102 C84,94 92,96 100,100 Z"/>

        <!-- Center stamens -->
        <circle class="stamen-dot" cx="100" cy="100" r="3.5"/>
        <circle class="stamen-dot" cx="100" cy="93" r="1.2"/>
        <circle class="stamen-dot" cx="106" cy="97" r="1.2"/>
        <circle class="stamen-dot" cx="105" cy="104" r="1.2"/>
        <circle class="stamen-dot" cx="100" cy="108" r="1.2"/>
        <circle class="stamen-dot" cx="94" cy="104" r="1.2"/>
        <circle class="stamen-dot" cx="94" cy="97" r="1.2"/>

        <!-- Fine detail lines -->
        <path class="petal-path" style="opacity:0.2; stroke-width:0.4"
          d="M100,97 L100,72 M100,97 L120,90 M100,97 L116,113 M100,97 L98,120 M100,97 L80,112 M100,97 L72,97 M100,97 L80,80"/>
      </svg>
    </div>

    <div class="avatar-name">
      <h1>Camellia</h1>
      <p>白山茶</p>
    </div>
  </div>

  <!-- Chat Messages -->
  <div class="chat-area" id="chatArea">
    <div class="msg ai">
      <div class="msg-avatar">✿</div>
      <div class="msg-bubble">你好，我是 Camellia。你也可以叫我小白 。<br>有什么我可以帮你的吗？</div>
    </div>
  </div>

  <!-- Input Bar -->
  <div class="input-bar">
    <div class="input-container">
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div class="mic-wave" id="micWave">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <textarea id="userInput" rows="1" placeholder="和 Camellia 说些什么……" maxlength="1000"></textarea>
      </div>
      <div class="btn-group">
        <button class="icon-btn" id="micBtn" title="语音输入">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6 9a6 6 0 0 0 12 0h2a8 8 0 0 1-7 7.93V20h3v2H8v-2h3v-3.07A8 8 0 0 1 4 10h2z"/>
          </svg>
        </button>
        <button class="icon-btn" id="voiceToggleBtn" title="朗读声音设置">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.49 4.49 0 0 0 2.5-3.5zm2.5 0A7.5 7.5 0 0 0 14 5.5v2a5.5 5.5 0 0 1 0 9v2A7.5 7.5 0 0 0 19 12z"/>
          </svg>
        </button>
        <button class="icon-btn send-btn" id="sendBtn" title="发送">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="hint">按 Enter 发送 · 点击麦克风使用语音输入</p>
  </div>

  <!-- Voice Selector Panel -->
  <div class="voice-panel" id="voicePanel">
    <h4>朗读声线</h4>
    <div id="voiceList"></div>
  </div>

</div>

<script>

  const API_KEY   = 'sk-9b198fdb56814bb6850e7fb1fd39d25d';
  const API_URL   = 'https://api.deepseek.com/chat/completions';
  const MODEL     = 'deepseek-chat';

  const SYSTEM_PROMPT = `你是 Camellia（白山茶），一个温柔、内敛的 AI 助手。
你的性格如白山茶花：纯净、温柔、不张扬，像童年时的邻家小妹一样。
回答简洁而有情感。
用中文回答，除非用户使用其他语言。`;

  // ─── STATE ────────────────────────────────────────────────
  const conversationHistory = [];
  const MAX_HISTORY = 20;
  let isRecognizing = false;
  let recognition = null;
  let currentUtterance = null;
  let currentSpeakingMsg = null;
  let selectedVoiceURI = '';

  // ─── ELEMENTS ─────────────────────────────────────────────
  const chatArea     = document.getElementById('chatArea');
  const userInput    = document.getElementById('userInput');
  const sendBtn      = document.getElementById('sendBtn');
  const micBtn       = document.getElementById('micBtn');
  const micWave      = document.getElementById('micWave');
  const avatar       = document.getElementById('camelliaAvatar');
  const voiceToggle  = document.getElementById('voiceToggleBtn');
  const voicePanel   = document.getElementById('voicePanel');
  const voiceList    = document.getElementById('voiceList');

  // ─── AUTO-RESIZE TEXTAREA ─────────────────────────────────
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault(); sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  // ─── AVATAR BREATHING ─────────────────────────────────────
  function setAvatarSpeaking(on) {
    if (on) avatar.classList.add('breathing');
    else     avatar.classList.remove('breathing');
  }

  // ─── ADD MESSAGE ──────────────────────────────────────────
  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = role === 'ai' ? '✿' : '你';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    wrap.appendChild(av);
    wrap.appendChild(bubble);

    // Add TTS button for AI messages
    if (role === 'ai') {
      const ttsBtn = document.createElement('button');
      ttsBtn.className = 'msg-tts-btn';
      ttsBtn.innerHTML = '🔊 <span>朗读</span>';
      ttsBtn.title = '朗读此回复';
      ttsBtn.dataset.text = text;
      ttsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleTTS(ttsBtn, text);
      });
      bubble.appendChild(ttsBtn);
    }

    chatArea.appendChild(wrap);
    chatArea.scrollTop = chatArea.scrollHeight;
    return bubble;
  }

  // ─── TYPING INDICATOR ─────────────────────────────────────
  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg ai'; wrap.id = 'typing';
    const av = document.createElement('div');
    av.className = 'msg-avatar'; av.textContent = '✿';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    const ind = document.createElement('div');
    ind.className = 'typing-indicator';
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('div');
      d.className = 'typing-dot'; ind.appendChild(d);
    }
    bubble.appendChild(ind);
    wrap.appendChild(av); wrap.appendChild(bubble);
    chatArea.appendChild(wrap);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  // ─── TOAST ────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  // ─── SEND MESSAGE ─────────────────────────────────────────
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    userInput.value = '';
    userInput.style.height = 'auto';
    addMessage('user', text);

    conversationHistory.push({ role: 'user', content: text });
    if (conversationHistory.length > MAX_HISTORY * 2) {
      conversationHistory.splice(0, 2);
    }

    showTyping();
    setAvatarSpeaking(true);

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: MODEL,
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            ...conversationHistory
          ],
          temperature: 0.75,
          max_tokens: 1000,
          stream: false
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content || '…';

      hideTyping();
      addMessage('ai', reply);
      conversationHistory.push({ role: 'assistant', content: reply });
      if (conversationHistory.length > MAX_HISTORY * 2) {
        conversationHistory.splice(0, 2);
      }

    } catch (err) {
      hideTyping();
      console.error(err);
      addMessage('ai', `抱歉，出现了一些问题：${err.message}`);
      showToast('连接失败，请检查 API Key 或网络');
    } finally {
      setAvatarSpeaking(false);
    }
  }

  // ─── TEXT-TO-SPEECH ───────────────────────────────────────
  let synth = window.speechSynthesis;
  let availableVoices = [];

  function loadVoices() {
    return new Promise((resolve) => {
      const voices = synth.getVoices();
      if (voices.length > 0) {
        availableVoices = voices;
        resolve(voices);
      } else {
        synth.onvoiceschanged = () => {
          availableVoices = synth.getVoices();
          resolve(availableVoices);
        };
      }
    });
  }

  function populateVoicePanel() {
    voiceList.innerHTML = '';
    // Filter to Chinese + English voices, prefer natural-sounding ones
    const preferred = availableVoices.filter(v =>
      v.lang.startsWith('zh') || v.lang.startsWith('en')
    );
    // If no Chinese/English voices, show all
    const display = preferred.length > 0 ? preferred : availableVoices;
    if (display.length === 0) {
      voiceList.innerHTML = '<div style="font-size:0.75rem;color:var(--text-dim);padding:6px 0;">暂无可用声线</div>';
      return;
    }

    // Deduplicate by name
    const seen = new Set();
    const deduped = display.filter(v => {
      const key = v.name + v.lang;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    // If no selection yet, set default to first Chinese voice
    if (!selectedVoiceURI && deduped.length > 0) {
      const zhVoice = deduped.find(v => v.lang.startsWith('zh'));
      selectedVoiceURI = zhVoice ? zhVoice.voiceURI : deduped[0].voiceURI;
    }

    deduped.forEach(v => {
      const opt = document.createElement('div');
      opt.className = 'voice-option';
      if (v.voiceURI === selectedVoiceURI) opt.classList.add('active');
      const langLabel = v.lang.replace('_', '-');
      opt.innerHTML = `
        <div class="radio"></div>
        <span class="vname">${v.name}</span>
        <span class="vlang">${langLabel}</span>
      `;
      opt.addEventListener('click', () => {
        selectedVoiceURI = v.voiceURI;
        document.querySelectorAll('.voice-option').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        voiceToggle.classList.add('has-voices');
        showToast('声线已切换至：' + v.name);
      });
      voiceList.appendChild(opt);
    });
    if (deduped.length > 0) voiceToggle.classList.add('has-voices');
  }

  function getSelectedVoice() {
    return availableVoices.find(v => v.voiceURI === selectedVoiceURI) || null;
  }

  function toggleTTS(btn, text) {
    if (!synth) return;
    // If currently speaking this message, stop
    if (currentSpeakingMsg === btn && synth.speaking) {
      synth.cancel();
      currentSpeakingMsg = null;
      btn.classList.remove('speaking');
      btn.innerHTML = '🔊 <span>朗读</span>';
      setAvatarSpeaking(false);
      return;
    }
    // Stop any current speech
    synth.cancel();
    document.querySelectorAll('.msg-tts-btn.speaking').forEach(b => {
      b.classList.remove('speaking');
      b.innerHTML = '🔊 <span>朗读</span>';
    });

    const utterance = new SpeechSynthesisUtterance(text);
    const voice = getSelectedVoice();
    if (voice) utterance.voice = voice;
    utterance.lang = voice ? voice.lang : 'zh-CN';
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;

    utterance.onstart = () => {
      currentUtterance = utterance;
      currentSpeakingMsg = btn;
      btn.classList.add('speaking');
      btn.innerHTML = '⏹ <span>停止</span>';
      setAvatarSpeaking(true);
    };

    utterance.onend = () => {
      currentUtterance = null;
      currentSpeakingMsg = null;
      btn.classList.remove('speaking');
      btn.innerHTML = '🔊 <span>朗读</span>';
      setAvatarSpeaking(false);
    };

    utterance.onerror = (e) => {
      console.error('TTS error:', e);
      currentUtterance = null;
      currentSpeakingMsg = null;
      btn.classList.remove('speaking');
      btn.innerHTML = '🔊 <span>朗读</span>';
      setAvatarSpeaking(false);
    };

    synth.speak(utterance);
  }

  // ─── VOICE PANEL TOGGLE ───────────────────────────────────
  voiceToggle.addEventListener('click', () => {
    voicePanel.classList.toggle('open');
  });
  // Close panel when clicking outside
  document.addEventListener('click', (e) => {
    if (!voicePanel.contains(e.target) && e.target !== voiceToggle && !voiceToggle.contains(e.target)) {
      voicePanel.classList.remove('open');
    }
  });

  // ─── SPEECH RECOGNITION ───────────────────────────────────
  function setupSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SR) {
      // Mobile fallback: use input's native dictation
      const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);
      if (isMobile) {
        micBtn.title = '轻触后使用键盘自带语音输入';
        micBtn.style.opacity = '0.6';
        // On mobile, clicking mic focuses the textarea to bring up keyboard dictation
        micBtn.addEventListener('click', () => {
          userInput.focus();
          showToast('请在键盘上点击麦克风图标使用语音输入');
        });
      } else {
        micBtn.title = '您的浏览器不支持语音识别';
        micBtn.style.opacity = '0.3';
        micBtn.disabled = true;
      }
      return;
    }

    recognition = new SR();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isRecognizing = true;
      micBtn.classList.add('active');
      micWave.classList.add('active');
    };

    recognition.onresult = e => {
      let interim = '', final = '';
      for (const r of e.results) {
        if (r.isFinal) final += r[0].transcript;
        else interim += r[0].transcript;
      }
      userInput.value = final || interim;
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    };

    recognition.onend = () => {
      isRecognizing = false;
      micBtn.classList.remove('active');
      micWave.classList.remove('active');
      if (userInput.value.trim()) sendMessage();
    };

    recognition.onerror = e => {
      console.error('语音识别错误', e.error);
      isRecognizing = false;
      micBtn.classList.remove('active');
      micWave.classList.remove('active');
      if (e.error === 'not-allowed') {
        showToast('请允许使用麦克风权限');
      } else if (e.error !== 'no-speech') {
        showToast('语音识别失败：' + e.error);
      }
    };

    micBtn.addEventListener('click', () => {
      if (isRecognizing) { recognition.stop(); return; }
      try { recognition.start(); }
      catch(e) { console.error(e); showToast('无法启动语音识别'); }
    });
  }

  // ─── FLOATING PARTICLES ───────────────────────────────────
  function createParticles() {
    const container = document.getElementById('particlesBg');
    if (!container) return;

    // Small floating dots
    for (let i = 0; i < 30; i++) {
      const dot = document.createElement('div');
      dot.className = 'particle-dot';
      dot.style.left = Math.random() * 100 + '%';
      dot.style.width = (Math.random() * 3 + 1) + 'px';
      dot.style.height = dot.style.width;
      dot.style.animationDuration = (Math.random() * 15 + 10) + 's';
      dot.style.animationDelay = (Math.random() * 15) + 's';
      dot.style.opacity = Math.random() * 0.3 + 0.1;
      container.appendChild(dot);
    }

    // Floating petal-like symbols
    const symbols = ['❀', '✿', '❁', '✦', '·'];
    for (let i = 0; i < 8; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal-particle';
      petal.textContent = symbols[i % symbols.length];
      petal.style.left = Math.random() * 90 + 5 + '%';
      petal.style.fontSize = (Math.random() * 12 + 10) + 'px';
      petal.style.animationDuration = (Math.random() * 20 + 20) + 's';
      petal.style.animationDelay = (Math.random() * 20) + 's';
      container.appendChild(petal);
    }
  }

  // ─── MESSAGE ENTER ANIMATION ──────────────────────────────
  function animateMessageIn(el) {
    el.style.opacity = '0';
    el.style.transform = 'translateY(12px)';
    requestAnimationFrame(() => {
      el.style.transition = 'opacity 0.4s cubic-bezier(0.22,1,0.36,1), transform 0.4s cubic-bezier(0.22,1,0.36,1)';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    });
  }

  // ─── INIT ─────────────────────────────────────────────────
  setupSpeech();
  createParticles();

  // Initialize TTS voices
  loadVoices().then(voices => {
    populateVoicePanel();
  });
  // Reload voices when they change (e.g., on Chrome)
  if (synth) {
    synth.onvoiceschanged = () => {
      availableVoices = synth.getVoices();
      populateVoicePanel();
    };
  }

  // Also re-check voices after a delay for Safari
  setTimeout(async () => {
    const voices = synth.getVoices();
    if (voices.length > availableVoices.length) {
      availableVoices = voices;
      populateVoicePanel();
    }
  }, 1000);
</script>
</body>
</html>
